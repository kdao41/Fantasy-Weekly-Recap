name: Weekly Dispatch

# Tuesdays after Monday Night Football. Also runnable by hand from the Actions tab.
# Two times on purpose: GitHub often drops top-of-the-hour scheduled jobs, so the
# afternoon run is a safety net. It's a no-op if the morning run already wrote the
# week (the generator skips weeks that already exist), so nothing double-posts.
on:
  schedule:
    - cron: "37 14 * * 2"   # ~8:37am Central
    - cron: "37 18 * * 2"   # ~12:37pm Central — backup, only acts if the morning run was dropped
  workflow_dispatch:
    inputs:
      only_league:
        description: "Optional: a single Sleeper league ID to run (blank = all)"
        required: false
        default: ""
      force:
        description: "Overwrite an existing week's file? (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate dispatches
        id: gen
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY_LEAGUE: ${{ github.event.inputs.only_league }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: node generate-dispatch.mjs

      - name: Publish dispatches straight to the site
        if: steps.gen.outputs.wrote != '0' && steps.gen.outputs.wrote != ''
        run: |
          set -e
          git config user.name "dispatch-bot"
          git config user.email "actions@github.com"
          git add dispatches
          git commit -m "Weekly dispatch — auto-published $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
